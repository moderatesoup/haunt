name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # E6 isolation evidence attributes changes per commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest (FTS-only)
        env:
          HAUNT_FTS_ONLY: "1"
        run: pytest tests/

      - name: "Smoke: haunt --version"
        run: |
          haunt --version
          haunt --version | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'

      - name: "Smoke: haunt --help"
        run: haunt --help

      # No HAUNT_ALLOW_ALT_HOME_HOST_INSTALL here on purpose: a temp-home
      # smoke test must not bind the runner's global editor config, and this
      # step asserts nothing about hosts. bootstrap reports the skip and
      # carries on.
      - name: "Smoke: haunt observe + recall (FTS-only, temp home)"
        env:
          HAUNT_FTS_ONLY: "1"
        run: |
          export HAUNT_HOME="$(mktemp -d)"
          haunt bootstrap
          haunt observe "CI smoke test phrase ZEPHYR-42"
          haunt recall "ZEPHYR-42" | grep -q "ZEPHYR-42"
          haunt health

      # This step *does* assert a shortcut is written from a temp HAUNT_HOME,
      # so it opts in explicitly. HOME is a temp dir too, so nothing real is
      # touched -- which is exactly the deliberate alternate-home install the
      # escape hatch exists for.
      - name: "Smoke: haunt dash --install-icon writes shortcut"
        env:
          HAUNT_FTS_ONLY: "1"
          HAUNT_ALLOW_ALT_HOME_HOST_INSTALL: "1"
        run: |
          export HAUNT_HOME="$(mktemp -d)"
          export HOME="$(mktemp -d)"
          haunt bootstrap
          haunt dash --install-icon
          test -f "$HOME/.local/share/applications/haunt-memories.desktop"

  # The FTS-only job above no longer reaches sqlite-vec or the embedding
  # backend, so the hybrid path needs a run of its own.
  test-hybrid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.haunt/models
          # L11: the key names the model this job pins, so changing
          # HAUNT_EMBED_MODEL below without changing the key here would
          # silently reuse the wrong cached weights. restore-keys lets a
          # renamed key still warm-start from the previous cache instead of
          # paying a cold ~64 MB download on the first run after a bump.
          key: haunt-models-v1-BAAI-bge-small-en-v1.5
          restore-keys: |
            haunt-models-v1-

      - name: Pytest (sqlite-vec + embeddings)
        env:
          # One shared cache: without it every test downloads the model again
          # into its own temporary HAUNT_HOME.
          HAUNT_MODEL_CACHE: ~/.haunt/models
          HAUNT_EMBED_MODEL: BAAI/bge-small-en-v1.5
        run: pytest tests/
