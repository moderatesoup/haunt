[project]
name = "lore"
version = "0.1.0"
description = "engram — local-first verbatim memory for AI agents (package: lore)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "lore"}]
dependencies = [
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface_hub>=0.20.0",
    "mcp>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]

[project.scripts]
lore = "lore.cli:main"
lore-mcp = "lore.mcp_server:main"
lore-hook = "lore.cursor_hook:main"
engram = "lore.cli:main"
engram-mcp = "lore.mcp_server:main"
engram-hook = "lore.cursor_hook:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
